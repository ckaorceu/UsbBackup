name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate wrapper
        run: |
          cd ${{ github.workspace }}
          curl -sL -o gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar"
          cat > gradlew << 'GRADLEW_SCRIPT'
#!/bin/sh
# Gradle wrapper script
APP_NAME="Gradle"
APP_BASE_NAME=$(basename "$0")
DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
MAX_FD="maximum"
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
exec java $DEFAULT_JVM_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
GRADLEW_SCRIPT
          chmod +x gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias debug -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=City, ST=State, C=US"
          jarsigner -keystore debug.keystore \
            -storepass android -keypass android \
            app/build/outputs/apk/release/app-release-unsigned.apk debug
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/UsbBackup.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsbBackup-APK
          path: app/build/outputs/apk/release/UsbBackup.apk
