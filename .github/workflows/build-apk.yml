name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias debug -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=City, ST=State, C=US"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build release APK with Gradle
        run: ./gradlew assembleRelease
      - name: Sign APK with debug key
        run: |
          jarsigner -keystore debug.keystore \
            -storepass android -keypass android \
            app/build/outputs/apk/release/app-release-unsigned.apk debug
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/UsbBackup.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsbBackup-APK
          path: app/build/outputs/apk/release/UsbBackup.apk
