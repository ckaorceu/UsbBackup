name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleRelease
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Debug,O=Debug,C=US"
          jarsigner -keystore debug.keystore -storepass android -keypass android app/build/outputs/apk/release/app-release-unsigned.apk debug
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/UsbBackup.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UsbBackup-APK
          path: app/build/outputs/apk/release/UsbBackup.apk
